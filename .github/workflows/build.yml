name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip libffi-dev libssl-dev
          pip install buildozer cython==0.29.33

      - name: Force Accept License + Build
        run: |
          # 1- Primeira tentativa so pra baixar o SDK do buildozer
          buildozer android debug || true

          # 2- Cria licença nos 2 lugares
          mkdir -p ~/.android
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea731e4" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          cp ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license ~/.android/ || true
          echo "y" > ~/.android/repositories.cfg

          # 3- Instala o build-tools 37 na marra com YES
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "build-tools;37.0.0" "platform-tools" || true

          # 4- Agora build de verdade
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: Neon-Bixby-APK
          path: bin/*.apk
