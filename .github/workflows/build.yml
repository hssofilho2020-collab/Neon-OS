name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip libffi-dev
          pip install buildozer cython==0.29.33
      - run: |
          rm -rf.buildozer bin
          buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: neon-bixby-apk
          path: bin/*.apk
